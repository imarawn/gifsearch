<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shared GIF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-dark text-white flex items-center justify-center min-h-screen">
<div id="content" class="text-center p-4"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get('d');

  if (!encoded) {
    document.getElementById('content').innerText = 'Invalid share link.';
  } else {
    try {
      const decoded = JSON.parse(decodeURIComponent(atob(encoded)));
      document.getElementById('content').innerHTML = `
          <img src="${decoded.url}" alt="shared gif" class="max-w-[90%] max-h-[60vh] rounded shadow-lg mx-auto" />
          <div class="mt-4 text-white text-lg font-bold">${decoded.slug}</div>
        `;
    } catch (e) {
      document.getElementById('content').innerText = 'Could not parse shared data.';
    }
  }
</script>
</body>
</html>
