<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="helper.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0e0e0e;
            color: #eee;
            padding: 2rem;
        }

        .hidden {
            display: none;
        }

        .panel-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            flex: 1;
            min-width: 350px;
            max-width: 350px;
            min-height: 350px;
            max-height: 500px;
        }

        .card img {
            max-width: 100%;
            max-height: 150px;
            transition: transform 0.3s ease;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 8px;
            background: #2d2d2d;
            color: #eee;
        }

        button {
            padding: 0.75rem 1.25rem;
            background: #4ade80;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
        }

        h1, h2 {
            color: #4ade80;
        }

        .ai-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 2rem;
            margin-top: 1rem;
        }


        .ai-card img {
            object-fit: contain;
        }

        .ai-panel img:hover {
            transform: none !important;
            z-index: auto !important;
            position: static !important;
        }

        .ai-description-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #ddd;
            font-style: italic;
        }

        img:hover {
            transform: scale(2.5);
            z-index: 10;
            position: relative;
        }

        .flip-card {
            width: 100%;
            max-width: 100%;
            height: auto;
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            min-height: 180px;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            min-height: 180px;
            padding: 1rem;
            box-sizing: border-box;
            backface-visibility: hidden;
            border-radius: 8px;
            background: #2a2a2a;
            color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            color: #eee;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-content input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            background: #2d2d2d;
            border: none;
            color: #eee;
        }

    </style>
</head>
<body>
<header style="margin-bottom: 1rem;">
    <button onclick="window.location.href = 'index.html'">🏠 Return to Main View</button>
    <div id="counter" style="font-weight: bold;">Loading...</div>
</header>
<div class="panel-wrapper">
    <div id="admin-view" class="card">
        <h2>GIF Review</h2>
        <div id="emote-list" style="margin-top: 1rem;"></div>
    </div>

    <div id="review-low-confidence" class="card">
        <h2>🧠 Low-Confidence Review</h2>
        <div id="low-confidence-results" style="margin-top: 1rem;"></div>
        <button id="load-low-confidence-btn" onclick="showLowConfidenceReviewPanel()">
            🔍 Load Score < 0.9
        </button>
    </div>

    <div id="ai-description-panel" class="card">
        <h2>🤖 AI Description</h2>
        <div id="ai-description-preview" class="ai-panel"></div>
        <button id="load-ai-description">➡️ Load Another</button>
    </div>

    <div class="card">
        <h2>📊 Reason Stats</h2>
        <button onclick="loadReasonStats()">🔄 Load Reasons</button>
        <div id="reason-stats" style="margin-top: 1rem; max-height: 350px; overflow-y: auto;"></div>
    </div>

    <div class="card">
        <h2>🎛️ Key Setup</h2>
        <label>Key to Keep: <input id="key-1" type="text" maxlength="1" placeholder="e.g. A"/></label><br><br>
        <label>Key to Hide: <input id="key-2" type="text" maxlength="1" placeholder="e.g. D"/></label><br><br>
        <label>Key to Load new AI: <input id="key-3" type="text" maxlength="1" placeholder="e.g. SpaceBar"/></label><br><br>
        <button onclick="saveKeys()">💾 Save Keys</button>
    </div>
</div>

<div id="login-modal" class="modal">
    <div class="modal-content">
        <h2>🔐 Admin Login</h2>
        <input id="login-email" type="email" placeholder="Email" /><br/>
        <input id="login-password" type="password" placeholder="Password" /><br/>
        <button onclick="login()">Login</button>
        <p id="login-error" style="color: red; margin-top: 0.5rem;"></p>
    </div>
</div>

<script>
    checkAuth();

    async function checkAuth() {
        const { data: { user } } = await supabase.auth.getUser();

        if (!user) {
            document.getElementById('login-modal').style.display = 'flex';
        } else {
            document.getElementById('login-modal').style.display = 'none';
        }
    }

    async function login() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const errorDisplay = document.getElementById('login-error');

        const { error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            errorDisplay.textContent = '❌ ' + error.message;
        } else {
            errorDisplay.textContent = '';
            document.getElementById('login-modal').style.display = 'none';

            await checkAuth();
        }
    }

    let currentSlug = null;
    let lowConfidenceQueue = [];
    let currentReviewSlug = null;

    // AI Description Logic
    document.getElementById('load-ai-description').addEventListener('click', loadRandomAIDescription);
    loadRandomAIDescription();

    async function loadRandomAIDescription() {
        const preview = document.getElementById('ai-description-preview');
        preview.innerHTML = '⏳ Loading...';

        const {data, error} = await supabase
            .from('view_ai_described_emotes')
            .select('search_slug, url, description')
            .limit(1);

        if (error || !data?.length) {
            preview.innerHTML = `<p style="color:red;">❌ Failed to load emote: ${error?.message || 'No data found'}</p>`;
            return;
        }

        const emote = data[0];

        const flipCard = document.createElement('div');
        flipCard.className = 'flip-card';
        flipCard.onclick = () => flipCard.classList.toggle('flipped');

        flipCard.innerHTML = `
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <p class="ai-description-text">"${emote.description}"</p>
            </div>
            <div class="flip-card-back">
                <img src="${emote.url}" alt="${emote.search_slug}" style="max-height: 150px;" />
            </div>
        </div>
    `;

        preview.innerHTML = '';
        preview.appendChild(flipCard);
    }


    // Emote Review Logic
    async function loadEmotes() {
        const container = document.getElementById('emote-list');
        container.innerHTML = '⏳ Loading...';

        const {data, error} = await supabase
            .from('review')
            .select('search_slug, url')
            .is('nsfw_label', null)
            .limit(1);

        if (error) {
            container.innerHTML = `<p style="color:red;">❌ Failed to load: ${error.message}</p>`;
            return;
        }

        container.innerHTML = '';
        data.forEach(emote => {
            window.currentSlug = emote.search_slug;

            const row = document.createElement('div');
            row.style = 'margin-top: 2rem; display: flex; align-items: center; gap: 1rem; background: #222; padding: 1rem; border-radius: 12px;';
            row.innerHTML = `
                <img src="${emote.url}" alt="${emote.search_slug}" style="width: 160px; border-radius: 8px;" />
                <div>
                    <strong>${emote.search_slug}</strong><br>
                    <button onclick="setVisibility('${emote.search_slug}', true)">✅ Show</button>
                    <button onclick="setVisibility('${emote.search_slug}', false)">🚫 Hide</button>
                    <button onclick="loadEmotes()">⏩ Skip</button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    async function setVisibility(slug, visible) {
        const {error} = await supabase
            .from('emotes')
            .update({
                nsfw_label: visible ? 'sfw' : 'nsfw',
                llm_nsfw_reason: visible ? 'user marked as safe' : 'user marked as nsfw',
                nsfw_score: 1,
                nsfw_checked_at: new Date().toISOString()
            })
            .eq('search_slug', slug);

        if (error) alert('❌ Failed to update: ' + error.message);
        else loadEmotes();
    }

    // Low Confidence Panel
    function showLowConfidenceReviewPanel() {
        const btn = document.getElementById('load-low-confidence-btn');
        const container = document.getElementById('low-confidence-results');

        btn.disabled = true;
        btn.textContent = '⏳ Loading...';
        container.innerHTML = '';

        supabase
            .from('emotes')
            .select('search_slug, url, nsfw_score')
            .lt('nsfw_score', 0.9)
            .order('nsfw_score', {ascending: true})
            .limit(100)
            .then(({data, error}) => {
                if (error) {
                    container.innerHTML = `<p style="color:red;">❌ Failed to load: ${error.message}</p>`;
                    btn.textContent = '❌ Error';
                    return;
                }

                lowConfidenceQueue = data;
                btn.textContent = '🔍 Load Again';
                btn.disabled = false;
                showNextLowConfidenceEmote();
            });
    }

    function showNextLowConfidenceEmote() {
        const container = document.getElementById('low-confidence-results');
        container.innerHTML = '';

        if (!lowConfidenceQueue.length) {
            container.innerHTML = `<p>No more emotes to review ✅</p>`;
            return;
        }

        const emote = lowConfidenceQueue.shift();
        currentReviewSlug = emote.search_slug;

        const row = document.createElement('div');
        row.style = 'margin-top: 2rem; display: flex; align-items: center; gap: 1rem; background: #222; padding: 1rem; border-radius: 12px;';
        row.innerHTML = `
            <img src="${emote.url}" alt="${emote.search_slug}" style="width: 160px; border-radius: 8px;" />
            <div>
                <strong>${emote.search_slug}</strong><br>
                <em>Score: ${emote.nsfw_score.toFixed(3)}</em><br>
                <button onclick="handleReviewDecision(true)">✅ Show</button>
                <button onclick="handleReviewDecision(false)">🚫 Hide</button>
            </div>
        `;

        container.appendChild(row);
    }

    async function handleReviewDecision(visible) {
        const slug = currentReviewSlug;
        currentReviewSlug = null;
        if (visible) {
            const {error} = await supabase
                .from('emotes')
                .update({
                    nsfw_label: 'sfw',
                    nsfw_checked_at: new Date().toISOString(),
                    nsfw_score: 1
                })
                .eq('search_slug', slug);
            if (error) {
                alert('❌ Failed to update visibility: ' + error.message);
                return;
            }
        } else {
            const {error} = await supabase
                .from('emotes')
                .update({
                    nsfw_label: 'nsfw',
                    llm_nsfw_reason: 'user marked as nsfw',
                    nsfw_checked_at: new Date().toISOString(),
                    nsfw_score: 1
                })
                .eq('search_slug', slug);
            if (error) {
                alert('❌ Failed to update visibility: ' + error.message);
                return;
            }
        }

        showNextLowConfidenceEmote();
    }

    function saveKeys() {
        const key1 = document.getElementById('key-1').value.trim().toLowerCase();
        const key2 = document.getElementById('key-2').value.trim().toLowerCase();
        const key3 = document.getElementById('key-3').value.trim().toLowerCase();
        localStorage.setItem('action_key_1', key1);
        localStorage.setItem('action_key_2', key2);
        localStorage.setItem('action_key_3', key3);
        alert(`✅ Keys saved: [${key1}] for Keep, [${key2}] for Hide, [${key3}] for Load next AI`);
    }

    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        const key1 = localStorage.getItem('action_key_1') || 'a';
        const key2 = localStorage.getItem('action_key_2') || 'd';
        const key3 = localStorage.getItem('action_key_3') || ' ';

        if (key === key1) {
            console.log(window.currentSlug);
            setVisibility(window.currentSlug, true);
        } else if (key === key2) {
            console.log(window.currentSlug);
            setVisibility(window.currentSlug, false);
        } else if (key === key3) {
            e.preventDefault();
            loadRandomAIDescription();
        }
    });

    function loadKeys() {
        const key1 = localStorage.getItem('action_key_1') || '';
        const key2 = localStorage.getItem('action_key_2') || '';
        const key3 = localStorage.getItem('action_key_3') || '';

        document.getElementById('key-1').value = key1;
        document.getElementById('key-2').value = key2;
        document.getElementById('key-3').value = key3;
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadKeys();
        loadEmotes();
    });

    async function loadReasonStats() {
        const container = document.getElementById('reason-stats');
        container.innerHTML = '⏳ Loading...';

        const { data, error } = await supabase.rpc('get_reason_stats');

        if (error) {
            container.innerHTML = `<p style="color:red;">❌ Failed to load: ${error.message}</p>`;
            return;
        }

        container.innerHTML = '<ul style="list-style: none; padding-left: 0;">' +
            data.map(({ llm_nsfw_reason, count }) =>
                `<li><strong>${llm_nsfw_reason || '(empty)'}</strong>: ${count}</li>`
            ).join('') +
            '</ul>';
    }


</script>
<script src="counter.js"></script>

</body>
</html>
