<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0e0e0e;
            color: #eee;
            padding: 2rem;
        }

        .hidden {
            display: none;
        }

        .card {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            margin: 2rem auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 8px;
            background: #2d2d2d;
            color: #eee;
        }

        button {
            padding: 0.75rem 1.25rem;
            background: #4ade80;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #4ade80;
        }
    </style>
</head>
<body>

<div id="login-view" class="card">
    <h1>Admin Login</h1>
    <label for="email"></label><input type="email" id="email" placeholder="Email" autocomplete="username">
    <label for="password"></label><input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button onclick="signIn()">🔐 Log In</button>
    <div id="login-message"></div>
</div>

<div id="admin-view" class="card hidden">
    <h1>Admin Panel</h1>
    <button onclick="loadEmotes()">🔄 Load Emotes</button>
    <div id="emote-list"></div>
</div>
<div id="review-low-confidence" class="card">
    <h2>🧠 Low-Confidence Emotes Review</h2>
    <button id="load-low-confidence-btn" onclick="showLowConfidenceReviewPanel()">🔍 Load Emotes with Score &lt; 0.9</button>
    <div id="low-confidence-results" style="margin-top: 1rem;"></div>
</div>
<div id="key-setup" style="margin: 2rem auto; max-width: 400px;">
    <label>Key to Keep: <input id="key-1" type="text" maxlength="1" placeholder="e.g. A" /></label><br><br>
    <label>Key to Hide: <input id="key-2" type="text" maxlength="1" placeholder="e.g. D" /></label><br><br>
    <button onclick="saveKeys()">💾 Save Keys</button>
</div>

<script src="helper.js"></script>
<script>
    // Check for existing session
    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            const role = session.user?.user_metadata?.role;
            if (role === 'admin') {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                loadEmotes();
            }
        }
    });

    async function signIn() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
            document.getElementById('login-message').textContent = '❌ Login failed: ' + error.message;
            return;
        }

        const { user } = data;
        const role = user?.user_metadata?.role;

        if (role !== 'admin') {
            document.getElementById('login-message').textContent = '🚫 Access denied: Not an admin';
            await supabase.auth.signOut();
            return;
        }

        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('admin-view').classList.remove('hidden');
        loadEmotes();
    }

    let currentSlug = null;

    async function loadEmotes() {
        const { data, error } = await supabase
            .from('random_emotes')
            .select('search_slug, url')
            .is('nsfw_label', null)
            .limit(1)

        const container = document.getElementById('emote-list');
        container.innerHTML = '';

        if (error) {
            container.innerHTML = `<p style="color:red;">❌ Failed to load emotes: ${error.message}</p>`;
            return;
        }

        data.forEach(emote => {
            currentSlug = emote.search_slug;
            const row = document.createElement('div');
            row.style = 'margin-top: 2rem; display: flex; align-items: center; gap: 1rem; background: #222; padding: 1rem; border-radius: 12px; width: 100%;';

            row.innerHTML = `
        <img
  src="${emote.url}"
  alt="${emote.search_slug}"
  style="width: 160px; height: auto; border-radius: 8px; transition: transform 0.3s ease; cursor: zoom-in;"
  onmouseover="this.style.transform='scale(3)'"
  onmouseout="this.style.transform='scale(1)'"
/>
        <div style="flex:1;">
          <strong>${emote.search_slug}</strong><br>
          <button onclick="setVisibility('${emote.search_slug}', true)">✅ Show</button>
          <button onclick="setVisibility('${emote.search_slug}', false)">🚫 Hide</button>
        </div>
      `;
            container.appendChild(row);
        });
    }

    async function setVisibility(slug, visible, elementToRemove = null) {
        const { error } = await supabase
            .from('emotes')
            .update({
                is_visible: visible,
                nsfw_label: visible ? 'sfw' : 'nsfw',
                llm_nsfw_reason: visible ? 'user marked as safe' : 'user marked as nsfw',
                nsfw_score: 1,
                nsfw_checked_at: new Date().toISOString()
            })
            .eq('search_slug', slug);

        if (error) {
            alert('❌ Failed to update visibility: ' + error.message);
            return;
        }

        if (elementToRemove) {
            elementToRemove.remove();
        } else {
            loadEmotes();
        }
    }


    function saveKeys() {
        const key1 = document.getElementById('key-1').value.trim().toLowerCase();
        const key2 = document.getElementById('key-2').value.trim().toLowerCase();
        localStorage.setItem('action_key_1', key1);
        localStorage.setItem('action_key_2', key2);
        alert(`✅ Keys saved: [${key1}] for action 1, [${key2}] for action 2`);
    }

    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        const key1 = localStorage.getItem('action_key_1') || 'a';
        const key2 = localStorage.getItem('action_key_2') || 's';

        if (!currentSlug) return;

        if (key === key1) {
            setVisibility(currentSlug, true);
        } else if (key === key2) {
            setVisibility(currentSlug, false);
        }
    });

    let lowConfidenceQueue = [];
    let currentReviewSlug = null;

    async function handleReviewDecision(visible) {
        const slug = currentReviewSlug;
        currentReviewSlug = null;

        const { error } = await supabase
            .from('emotes')
            .update({
                is_visible: visible,
                nsfw_label: visible ? 'sfw' : 'nsfw',
                llm_nsfw_reason: visible ? 'user marked as safe' : 'user marked as nsfw',
                nsfw_checked_at: new Date().toISOString(),
                nsfw_score: 1
            })
            .eq('search_slug', slug);

        if (error) {
            alert('❌ Failed to update visibility: ' + error.message);
            return;
        }

        showNextLowConfidenceEmote();
    }

    function showNextLowConfidenceEmote() {
        const container = document.getElementById('low-confidence-results');
        container.innerHTML = '';
        if (!lowConfidenceQueue.length) {
            container.innerHTML = `<p>No more emotes to review ✅</p>`;
            return;
        }

        const emote = lowConfidenceQueue.shift();
        currentReviewSlug = emote.search_slug;

        const row = document.createElement('div');
        row.style = 'margin-top: 2rem; display: flex; align-items: center; gap: 1rem; background: #222; padding: 1rem; border-radius: 12px; width: 100%;';

        row.innerHTML = `
        <img
            src="${emote.url}"
            alt="${emote.search_slug}"
            style="width: 160px; height: auto; border-radius: 8px; transition: transform 0.3s ease; cursor: zoom-in;"
            onmouseover="this.style.transform='scale(3)'"
            onmouseout="this.style.transform='scale(1)'"
        />
        <div style="flex:1;">
            <strong>${emote.search_slug}</strong><br>
            <em>Score: ${emote.nsfw_score.toFixed(3)}</em><br>
            <button onclick="handleReviewDecision(true)">✅ Show</button>
            <button onclick="handleReviewDecision(false)">🚫 Hide</button>
        </div>
    `;

        container.appendChild(row);
    }

    function showLowConfidenceReviewPanel() {
        const btn = document.getElementById('load-low-confidence-btn');
        const container = document.getElementById('low-confidence-results');

        btn.disabled = true;
        btn.textContent = '⏳ Loading...';
        container.innerHTML = '';

        supabase
            .from('emotes')
            .select('search_slug, url, nsfw_score')
            .lt('nsfw_score', 0.9)
            .order('nsfw_score', { ascending: true })
            .limit(20)
            .then(({ data, error }) => {
                if (error) {
                    container.innerHTML = `<p style="color:red;">❌ Failed to load: ${error.message}</p>`;
                    btn.textContent = '❌ Error';
                    return;
                }

                lowConfidenceQueue = data;
                btn.textContent = '🔍 Load Again';
                btn.disabled = false;
                showNextLowConfidenceEmote();
            });
    }


</script>

</body>
</html>
